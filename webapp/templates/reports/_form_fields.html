<div class="field"><label for="name">Name</label><input type="text" id="name" name="name" value="{{ report.name|default:'' }}" maxlength="120" required></div>
<div class="field"><label for="dashboard">Prints the dashboard</label><select id="dashboard" name="dashboard" required>{% for b in boards %}<option value="{{ b.pk }}"{% if b.pk == report.dashboard_id %} selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></div>
<div class="field"><label for="intro">Opening text (optional)</label><textarea id="intro" name="intro" rows="3" maxlength="3000">{{ report.intro|default:'' }}</textarea></div>
<label class="small" style="font-weight:400"><input type="checkbox" name="include_tables"{% if not report or report.include_tables %} checked{% endif %}> Print the numbers under each chart</label>
<div class="toolbar"><div class="field"><label for="schedule">Make it on its own</label><select id="schedule" name="schedule">{% for code, name in schedules.items %}<option value="{{ code }}"{% if report.schedule == code %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
  <div class="field"><label for="weekday">If weekly, on</label><select id="weekday" name="weekday">{% for n, name in weekdays %}<option value="{{ n }}"{% if report.weekday == n %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></div></div>
<span class="help">Made by the <code>reports</code> step of <code>./run_all.sh</code>, into output/reports/, with its owner's rights. A run that's missed happens at the next one.</span>
<label class="small" style="font-weight:400"><input type="checkbox" name="shared"{% if report.shared %} checked{% endif %}> Share with everyone who has Reports</label>
