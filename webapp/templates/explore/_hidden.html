{% load tz %}{% if hidden %}<div class="table-wrap"><table class="list"><thead><tr><th>Record</th><th>Hidden by</th><th>When</th><th></th></tr></thead><tbody>
  {% for h in hidden %}<tr><td>{{ h.label|default:h.record }}<div class="muted small mono" style="overflow-wrap:anywhere">{{ h.record }}</div></td><td>{{ h.by }}</td><td class="nowrap">{{ h.at|localtime|date:"Y-m-d H:i" }}</td>
    <td>{% if may_hide %}<button class="btn" hx-post="{% url 'dataset_unhide' ds.ref %}" hx-vals='{"record": "{{ h.record|escapejs }}"}' hx-target="#hidden">Show again</button>{% endif %}</td></tr>{% endfor %}
</tbody></table></div>{% else %}<p class="muted">Nothing is hidden.</p>{% endif %}
