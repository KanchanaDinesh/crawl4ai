{% if form.non_field_errors %}<ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
{% for f in form %}
<div class="field">
  <label for="{{ f.id_for_label }}">{{ f.label }}</label>
  {{ f }}
  {% if f.help_text %}<span class="help">{{ f.help_text|safe }}</span>{% endif %}
  {{ f.errors }}
</div>
{% endfor %}
