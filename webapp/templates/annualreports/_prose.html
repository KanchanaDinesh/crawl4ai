<div class="ar-prose">{% for b in blocks %}{% if b.kind == "h" %}<h3>{{ b.html }}</h3>{% elif b.kind == "quote" %}<blockquote>{{ b.html }}</blockquote>{% elif b.kind == "ul" %}<ul>{% for i in b.items %}<li>{{ i.html }}</li>{% endfor %}</ul>{% else %}<p>{{ b.html }}</p>{% endif %}{% empty %}<p class="muted">{{ empty|default:"No text on this page." }}</p>{% endfor %}</div>
