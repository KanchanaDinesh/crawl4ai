{% load insights_ui %}{% if rows %}<div class="bars{% if clickable %} click-bars{% endif %}">{% for r in rows %}<div class="row" title="{{ r.title }}"{% if r.search %} data-search="{{ r.search }}" role="button" tabindex="0"{% elif r.set_field %} data-set-field="{{ r.set_field }}" data-set-value="{{ r.set_value }}" role="button" tabindex="0"{% endif %}><span>{{ r.label }}</span><i style="width:{{ r.width|stringformat:".1f" }}%"></i><span class="n">{{ r.n|num }}</span></div>{% endfor %}</div>{% else %}<div class="muted small">No data yet.</div>{% endif %}
