[project]
name = "web-scrapers"
version = "0.1.0"
description = "Web scrapers, a tech intelligence pipeline and a world news collector built on crawl4ai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crawl4ai==0.9.5",
    "aiohttp>=3.11",
    "beautifulsoup4>=4.12",
    "tldextract>=5.1",
    "feedparser>=6.0",
    "pytz>=2026.6",
    "psycopg[binary]>=3.2",
    "django>=5.2.19,<5.3",
    "django-htmx>=1.29,<2",
    "django-axes>=8.3.1,<9",
    "argon2-cffi>=25.1",
    "openpyxl>=3.1.5,<4",
    "weasyprint>=66,<71",
    "anthropic>=2.4,<3",
    "sqlglot>=30,<31",
    "tinycss2>=1.5,<2",
]

[tool.uv]
# Scripts are run as modules (python -m scrapers.news); nothing to build or install.
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "webapp.settings"   # the web app's tests (tests/test_webapp.py); others don't touch Django
django_find_project = false
pythonpath = ["."]
# pytest keeps the temp folders of the last 3 runs on the Mac's own drive (~140 MB); that drive was nearly full
tmp_path_retention_count = 1
