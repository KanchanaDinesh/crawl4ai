[project]
name = "web-scrapers"
version = "0.1.0"
description = "News, product, IMDb and Colombo Stock Exchange scrapers built on crawl4ai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crawl4ai==0.9.5",
    "aiohttp>=3.11",
    "beautifulsoup4>=4.12",
]

[tool.uv]
# Scripts are run as modules (python -m scrapers.news); nothing to build or install.
package = false
