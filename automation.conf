# Settings for run_all.sh and schedule.sh (manual and scheduled runs).
# Plain shell: NAME="value". Lines starting with # are comments.
#
# Steps:
#   markets      stock, index, gold/silver, FX and crypto prices
#   news         world, tech, markets and crypto headlines
#   news_analyze our own analysis of the saved headlines: biggest stories, topics, names, countries, tone (offline, ~2s)
#   tech_collect tech intel, part 1: find and store new sites (discover, qualify, registration dates). Fast, no browser
#   tech_update  tech intel, part 2: profile new sites, re-check known ones, report. Slow, uses the browser
#   tech_company tech intel: company facts from each site's own pages (social links, people, employees, GitHub). No browser
#   tech         both parts in one step (the old way)
#   tech_quick   fast tech-intel run for schedules: live queue + Hacker News -> qualify -> registration dates
#   vehicles     latest ikman.lk + riyasewana ads
#   lknews       the original Sri Lankan news scraper (scrapers/news)
#   briefing     the day's summary text + a 30-second video from all the data (offline, no AI; needs ffmpeg)

# Steps for a plain ./run_all.sh (no profile)
STEPS="markets news news_analyze tech_collect tech_company vehicles briefing"   # tech_update paused for now (Kanchana, 2026-11-03); run it by hand: ./run_all.sh tech_update

# Profiles: groups of steps to schedule at different speeds
#   ./schedule.sh every 15m --profile frequent
#   ./schedule.sh every 1h  --profile hourly
#   ./schedule.sh watch on        (live certificate listener, always on)
PROFILE_frequent="tech_quick vehicles"
PROFILE_hourly="markets news tech_collect"

# Extra options for each step (leave empty for the defaults)
MARKETS_ARGS=""                          # e.g. "--only lk,crypto"
NEWS_ARGS=""                             # e.g. "--limit 20"  or  "--group LK --group TECH"
NEWS_ANALYZE_ARGS=""                     # e.g. "--days 7" for a weekly view
TECH_ARGS="--limit 50 --max-minutes 20"  # keep the full run bounded: at most 50 sites / 20 min per stage
TECH_COLLECT_ARGS="--max-minutes 10"     # new sites: no site limit, at most 10 min per stage
TECH_UPDATE_ARGS="--limit 50 --max-minutes 20"   # browser part: at most 50 sites / 20 min per stage
TECH_COMPANY_ARGS="--max-minutes 10"     # company facts: newest sites first, at most 10 min (the rest next run)
TECH_QUICK_ARGS=""                       # e.g. "--max-minutes 5"
VEHICLES_ARGS="--limit 20"               # ads per site per run; a site gets at most 120s (--max-seconds 60 to change)
LKNEWS_ARGS=""
BRIEFING_ARGS=""                         # e.g. --link "t.me/your-channel" --title "YOUR CHANNEL NAME"

# Keep the Chromium browser on the Mac's own drive instead of this project folder (about 500 MB).
# Needed if this drive is exFAT/FAT (no symbolic links): `uv run python doctor.py` tells you.
# After changing it, reinstall the browser:  source env.sh && uv run crawl4ai-setup
BROWSERS_ON_SYSTEM_DRIVE=0

# Extra Chromium flags for every browser the tools start. Leave it commented out for the default,
# "--in-process-gpu" (Chromium's separate GPU process crashed on this Mac and took the browser with it).
# `uv run python doctor.py` shows whether the flags are needed. CHROMIUM_ARGS="" means no extra flags.
# CHROMIUM_ARGS="--in-process-gpu --disable-gpu-sandbox"

# How many days of log files to keep in logs/
KEEP_LOG_DAYS=30

# Advanced: override a step's whole command, or add your own step (and which tool it locks):
#   STEP_mystep="uv run --frozen python -m scrapers.products"
#   TOOL_mystep="scrapers"
#   PROFILE_frequent="tech_quick vehicles mystep"
