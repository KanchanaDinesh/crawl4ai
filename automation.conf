# Settings for run_all.sh (used for manual and scheduled runs).
# This file is plain shell: NAME="value". Lines starting with # are comments.

# Steps that run by default, in this order. Available: markets news tech vehicles lknews
STEPS="markets news tech"

# Extra options for each step (leave empty for the defaults)
MARKETS_ARGS=""                          # e.g. "--only lk,crypto"
NEWS_ARGS=""                             # e.g. "--limit 20"  or  "--group LK --group TECH"
TECH_ARGS="--limit 50 --max-minutes 20"  # keep tech intel bounded: at most 50 sites / 20 min per stage
VEHICLES_ARGS=""                         # e.g. "--site ikman"
LKNEWS_ARGS=""

# How many days of log files to keep in logs/
KEEP_LOG_DAYS=30

# Advanced: you can override a step's whole command, or add your own step, like this:
#   STEP_mystep="uv run --frozen python -m scrapers.products"
#   STEPS="markets news mystep"
